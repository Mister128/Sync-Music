targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: en
          fallback_strategy: base_locale
          input_directory: lib/i18n
          output_directory: lib/i18n
          output_file_name: strings.g.dart
      drift_dev:
        options:
          databases:
            sync_music: lib/core/database/app_database.dart