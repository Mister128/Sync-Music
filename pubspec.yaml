name: sync_music
description: "Playlist-first music player with P2P sync"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  #  Logger
  talker: ^5.1.20
  talker_flutter: ^5.1.20

  #  Localization
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  #  Databases
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0

  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0

  #  Media scanning
  audio_metadata_reader: ^1.8.0
  file_picker: ^13.1.0
  image: ^4.10.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  slang_build_runner: ^4.19.0
  very_good_analysis: ^11.0.0
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true